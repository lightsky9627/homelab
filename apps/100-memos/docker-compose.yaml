# ======================================================================
#  Memos —— 轻量级笔记 / 备忘服务
#
#  数据库策略：用 memos 自带的 SQLite，不接共享 PostgreSQL。
#
#  为什么选 SQLite：
#    1. 个人单用户场景，SQLite 的性能绰绰有余（官网自己就用 SQLite 跑）
#    2. 没有额外依赖，不用先起 PG、建库、配密码，少三个出错环节
#    3. 备份恢复极简：笔记正文和附件都在 ./data 里，还原文件就能用，
#       不需要「起 PG → 建库 → 灌 SQL → 对密码」这一长串
#    4. PG 挂了会拖垮所有接它的应用，SQLite 坏了只影响 memos 自己
#
#  什么时候该换回 PG：多人协作、笔记量到几十万条、或要做复杂查询。
#  真到那天，memos 支持用 MEMOS_DRIVER 切换，infra/020-postgresql 一直留着。
#
#  镜像用 stable 滚动标签 + watchtower 自动更新：
#  memos 是应用层，升级只涉及自己的表结构迁移，它启动时会自动执行，
#  不像数据库大版本那样有不可逆风险。
# ======================================================================

name: memos

services:
  memos:
    image: neosmemo/memos:${MEMOS_TAG}
    container_name: memos
    restart: unless-stopped

    environment:
      # ---- 数据库：SQLite，库文件落在下面挂载的数据目录里 ----
      # memos 会在 /var/opt/memos 下自动创建 memos_prod.db
      MEMOS_DRIVER: sqlite

      # 容器内监听端口，保持 memos 默认的 5230
      MEMOS_PORT: "5230"

      # 对外访问地址（带协议的完整域名）。
      # 用于生成分享链接、RSS 地址等，必须和实际访问的域名一致，否则链接会错。
      MEMOS_INSTANCE_URL: ${MEMOS_INSTANCE_URL}

      # 容器以 root 启动，entrypoint 修好数据目录权限后降权到这个 UID/GID 运行
      MEMOS_UID: "${MEMOS_UID}"
      MEMOS_GID: "${MEMOS_GID}"

      TZ: ${TZ}

    volumes:
      # 笔记正文（SQLite 库文件）、附件、缩略图全都在这个目录里。
      # 备份只要备它，恢复只要还原它。
      - ./data/memos:/var/opt/memos

    ports:
      # memos 默认端口 5230，只绑 127.0.0.1，由 Caddy 反代出去
      # 反代命令：bin/hl proxy add memos 5230
      - "127.0.0.1:${MEMOS_PORT}:5230"

    healthcheck:
      # alpine 基础镜像自带 busybox wget
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5230/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

    labels:
      # 应用层，开启自动更新
      com.centurylinklabs.watchtower.enable: "true"

      # ---- 备份策略 ----
      # enable  : 开启备份
      # paths   : 要备份的目录（相对本应用目录，逗号分隔）
      # sqlite  : 需要做一致性快照的库文件（见下方说明，逗号分隔）
      # exclude : 不备份的内容（glob 模式，逗号分隔）
      #
      # 关于 sqlite：SQLite 写入时数据分散在 .db 和 .db-wal 两个文件，
      # 直接 cp 可能拷到「写到一半」的状态，恢复出来是坏库。
      # 声明了这个标签，备份脚本会先用 sqlite3 .backup 取一份原子快照，
      # 保证拿到的一定是完整可用的库。
      homelab.backup.enable: "true"
      homelab.backup.paths: "./data/memos"
      homelab.backup.sqlite: "./data/memos/memos_prod.db"
      homelab.backup.exclude: "*.db-wal,*.db-shm,*.log,thumbs/"
