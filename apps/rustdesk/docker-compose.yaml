# ======================================================================
#  RustDesk —— 自建远程桌面服务端（开源 OSS 版）
#
#  两个进程拆成两个服务：
#    hbbs = ID/Rendezvous 服务器：客户端注册、心跳、NAT 打洞协商、web 客户端
#    hbbr = Relay 中继服务器：打洞失败时转发流量（走它会消耗你的带宽）
#  两者共享同一个 ./data 卷，因为要用同一对密钥（id_ed25519 / .pub）。
#
#  ⚠️ 和其它应用不同：RustDesk 必须直接对公网开放端口！
#     客户端用的是自有的 TCP/UDP 协议，不是 HTTP，Caddy 这类 HTTP 反代
#     无法转发。所以 BIND_ADDR 要设成 0.0.0.0，并在防火墙放行：
#         TCP 21115-21119    UDP 21116
#
#  端口全部是 RustDesk 原生默认值，宿主端口 = 容器端口，一一对应：
#     21115/tcp  hbbs  NAT 类型探测
#     21116/tcp  hbbs  ID 注册 / 心跳（主端口）
#     21116/udp  hbbs  打洞
#     21117/tcp  hbbr  中继
#     21118/tcp  hbbs  web 客户端 websocket
#     21119/tcp  hbbr  web 客户端 websocket
#
#  注意：官方镜像是 FROM scratch 的纯静态二进制，容器里没有 shell 也没有
#  wget，写不了 healthcheck，这里只能省略。
# ======================================================================

name: rustdesk

services:
  # ---- 中继服务器：先启动，因为 hbbs 依赖它 ----
  hbbr:
    image: rustdesk/rustdesk-server:${RUSTDESK_TAG}
    container_name: rustdesk-hbbr
    restart: unless-stopped

    command: hbbr ${RUSTDESK_HBBR_OPTS}

    environment:
      TZ: ${TZ}

    volumes:
      # 密钥和配置都在容器内的 /root 下
      - ./data:/root

    ports:
      - "${BIND_ADDR}:21117:21117"
      - "${BIND_ADDR}:21119:21119"

    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # ---- ID / 打洞服务器 ----
  hbbs:
    image: rustdesk/rustdesk-server:${RUSTDESK_TAG}
    container_name: rustdesk-hbbs
    restart: unless-stopped

    # 宿主端口 = 容器端口，中继地址无需用 -r 覆盖
    command: hbbs ${RUSTDESK_HBBS_OPTS}

    environment:
      TZ: ${TZ}

    volumes:
      - ./data:/root

    ports:
      - "${BIND_ADDR}:21115:21115"
      - "${BIND_ADDR}:21116:21116"
      - "${BIND_ADDR}:21116:21116/udp"
      - "${BIND_ADDR}:21118:21118"

    depends_on:
      # scratch 镜像无法做 healthcheck，这里只能保证启动顺序
      - hbbr

    labels:
      com.centurylinklabs.watchtower.enable: "true"
      # 备份：密钥文件很小但极其重要，丢了所有客户端都要重新配置
      homelab.backup.enable: "true"
      homelab.backup.paths: "./data"
